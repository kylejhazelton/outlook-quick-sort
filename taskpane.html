<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Sort</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css">
</head>
<body>
  <header class="item-bar">
    <div id="subject" class="subject">No message selected</div>
    <div id="mode" class="mode" hidden>Preview mode: sample data</div>
  </header>

  <section>
    <div class="section-head">
      <h2>Categories</h2>
      <button id="refresh" class="icon-btn" title="Reload categories" aria-label="Reload categories">&#x21bb;</button>
    </div>
    <div id="categories" class="chips" role="group" aria-label="Categories"></div>
    <p id="cat-empty" class="muted" hidden>No categories in your mailbox yet. Create some in Outlook, then click &#x21bb;.</p>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-msg"></span>
  </div>

  <script src="taskpane.js"></script>
</body>
</html>
